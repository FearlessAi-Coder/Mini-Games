<!-- ECONOMY V6: 4x slower coin earnings + 3x shop pricing -->
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Mini Arcade — Play &amp; Win</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Press+Start+2P&amp;display=swap" rel="stylesheet"/>
<style>
:root{--bg:#1d1b2f;--panel:#2b2845;--ink:#f4efe6;--hot:#ff5d73;--gold:#ffc857;--mint:#5eead4;--mute:#b9b3d6}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:700;font-size:15px;background:radial-gradient(800px 480px at 50% -8%,var(--panel),var(--bg) 70%) no-repeat var(--bg);display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 14px 100px;transition:background .3s}
header{width:100%;max-width:380px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hr{display:flex;gap:8px;align-items:center}
h1{font-family:'Press Start 2P',monospace;font-size:14px;margin:0;color:var(--gold);text-shadow:0 0 14px rgba(255,200,87,.6)}
h2{font-size:16px;font-weight:800;color:var(--gold);margin:20px 0 8px}
button{font:inherit;color:var(--ink);background:rgba(255,255,255,.09);border:0;border-radius:14px;padding:11px 16px;cursor:pointer;transition:background .15s,transform .1s}
button:hover:not(:disabled){background:rgba(255,255,255,.18)}
button:active:not(:disabled){transform:scale(.96)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.pill{background:rgba(255,255,255,.09);border-radius:99px;padding:9px 14px;color:var(--gold);font-weight:800}
.icon{width:40px;height:40px;padding:0;border-radius:50%;font-size:16px}
#daily{width:100%;max-width:380px;background:linear-gradient(90deg,#ffc857,#ff9f5a);color:#1d1b2f;font-weight:800;box-shadow:0 6px 20px rgba(255,200,87,.3)}
#bar{width:100%;max-width:380px;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:800}
#bar button{padding:8px 12px;font-size:13px}
#lvl{display:flex;gap:4px;background:rgba(255,255,255,.07);padding:4px;border-radius:16px}
#lvl button{background:none;font-size:13px;padding:8px 12px;border-radius:12px;color:var(--mute)}
#lvl button.on{background:var(--gold);color:#1d1b2f}
#info{font-family:'Press Start 2P',monospace;font-size:9px;min-height:14px;color:#d6d1f0}
#stage{width:100%;max-width:380px}
canvas{display:block;width:100%;height:auto;border-radius:22px;background:#0f0e1a;touch-action:none;box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.1)}
#home{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 10px;border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.05));box-shadow:0 8px 24px rgba(0,0,0,.25)}
.card i{font-style:normal;font-size:42px}
.card b{font-size:16px;font-weight:800}
small{font-size:12px;color:var(--mute);line-height:1.4;font-weight:700}
#ttt,#wh{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
#ttt button,#wh button{aspect-ratio:1;font-size:36px;padding:0;border-radius:20px}
#mem button{aspect-ratio:1;font-size:26px;padding:0;border-radius:16px}
#mem button.up{background:var(--gold);color:#1d1b2f}
#mem button.done{background:var(--mint);color:#1d1b2f;cursor:default}
#again{margin-top:14px;width:100%;background:var(--gold);color:#1d1b2f;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;margin-bottom:8px;background:rgba(255,255,255,.06);border-radius:16px;font-size:14px}
.row button{padding:8px 14px;font-size:13px;white-space:nowrap}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.7);vertical-align:middle;margin-right:8px}
input{font:inherit;color:var(--ink);background:rgba(255,255,255,.09);border:0;border-radius:14px;padding:12px 14px;width:100%}
#prof button{margin-top:14px;width:100%}
p.tip{font-size:12px;line-height:1.5;max-width:380px;text-align:center;color:var(--mute);margin:0}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(20,18,36,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.1);z-index:5}
#tabs button{flex:1;max-width:100px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;padding:6px 4px;font-size:11px;font-weight:800;color:var(--mute)}
#tabs button em{font-style:normal;font-size:21px}
#tabs button.on{color:var(--gold);background:rgba(255,255,255,.1)}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--gold);color:#1d1b2f;padding:10px 18px;border-radius:99px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .25s;z-index:9;white-space:nowrap}
#toast.on{transform:translateX(-50%) translateY(0)}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .5s}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:no-preference){#stage>*:not([hidden]):not(canvas){animation:fade .25s}.card:hover{transform:translateY(-3px)}}
.wr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.wr i{font-style:normal;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;text-transform:uppercase;background:rgba(255,255,255,.08);border-radius:12px}
.wr i.ok,.kr button.ok{background:#3fbf9f;color:#10202a}
.wr i.in,.kr button.in{background:var(--gold);color:#1d1b2f}
.wr i.no,.kr button.no{background:rgba(0,0,0,.35);color:var(--mute)}
.kr{display:flex;gap:4px;justify-content:center;margin-top:6px}
.kr button{flex:1;padding:12px 0;font-size:14px;border-radius:10px;text-transform:uppercase}
#ckb{display:block;margin:6px auto 14px;font-size:96px;line-height:1;padding:14px 26px;border-radius:50%;background:rgba(255,255,255,.07)}
</style>
<style id="arcade-polish">
:root{
  --bg:#21134a;--panel:#45218a;--ink:#fffaf2;--gold:#ffe071;
  --mute:#e4d9ff;--hot:#ff6b62;--mint:#6cf0c2;
}
body{
  min-height:100svh;padding:18px 16px calc(112px + env(safe-area-inset-bottom));
  gap:15px;
  background:
    radial-gradient(ellipse at 50% -10%,rgba(255,255,255,.22),transparent 48%),
    radial-gradient(ellipse at 12% 45%,rgba(255,111,171,.22),transparent 42%),
    linear-gradient(160deg,#6936c8 0%,#3b208b 48%,#171344 100%) !important;
}
header,#bar,#lvl,#stage,#daily,.tip{width:min(100%,520px);max-width:520px}
header{padding:4px 2px 8px}
h1{font-family:'Nunito',system-ui,sans-serif;font-size:21px;font-weight:1000;letter-spacing:-.6px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.pill{background:rgba(21,12,61,.38);border:1px solid rgba(255,255,255,.18);color:#fff}
.icon{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.16)}
#daily{border-radius:17px;padding:14px 18px;font-size:15px}
#info{font-family:'Nunito',system-ui,sans-serif;font-size:13px;font-weight:900;letter-spacing:.2px;color:#fff;min-height:18px;text-align:center}
#stage{padding-bottom:6px}
#home{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{
  min-height:194px;padding:20px 12px 16px;gap:8px;border-radius:28px;
  border:2px solid rgba(255,255,255,.36);
  box-shadow:0 7px 0 rgba(20,8,64,.28),0 15px 26px rgba(13,7,48,.22),inset 0 2px 0 rgba(255,255,255,.35);

.card:nth-child(4n+1){background:linear-gradient(155deg,#55e49b,#16a96c)}
.card:nth-child(4n+2){background:linear-gradient(155deg,#ffb16b,#ff623f)}

.card[data-g=escape]{background:linear-gradient(155deg,#ffb16b,#c2512b)}
.card .ic{width:88px;height:88px;border-radius:27px;background:rgba(30,18,74,.22);border:3px solid rgba(255,255,255,.7);box-shadow:0 5px 0 rgba(0,0,0,.18),inset 0 2px 8px rgba(255,255,255,.25)}
.card .ic svg{width:68px;height:68px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.15))}
.card b{font-size:19px;line-height:1.1;text-shadow:0 2px 3px rgba(0,0,0,.18)}
.card small{font-size:13px;color:rgba(255,255,255,.92)}
.card:active{transform:scale(.975)}
canvas{border-radius:25px;border:2px solid rgba(255,255,255,.28);box-shadow:0 16px 34px rgba(10,4,38,.35)}
#lvl{background:rgba(31,17,82,.72);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(12px);box-shadow:0 8px 20px rgba(0,0,0,.2)}
#ln{color:#fff!important}#ln small{color:#e4d9ff}
#bar button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2)}
#gt{font-weight:1000}
#tabs{
  background:rgba(27,16,74,.88);border-top:1px solid rgba(255,255,255,.18);
  box-shadow:0 -10px 30px rgba(17,8,55,.2);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));
}
#tabs button{border-radius:17px;max-width:124px;padding:8px 4px;font-size:12px}
#tabs button em{font-size:23px}
#tabs button.on{background:linear-gradient(135deg,#ffe27b,#ffb64d);color:#38205f;box-shadow:0 5px 14px rgba(255,190,74,.3)}
.row{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1)}
input{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.16)}
#again{border-radius:16px;background:linear-gradient(90deg,#ffe27b,#ffb64d);box-shadow:0 5px 0 rgba(111,62,22,.25)}
#toast{top:18px;background:#ffe27b;color:#35205e}
@media(max-width:380px){
  body{padding-left:12px;padding-right:12px}
  .card{min-height:170px;padding:15px 8px}
  .card .ic{width:76px;height:76px}
  .card .ic svg{width:60px;height:60px}
  .card b{font-size:17px}
}
@media(prefers-reduced-motion:no-preference){
  .card{transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}
  .card:hover{filter:brightness(1.06);box-shadow:0 10px 0 rgba(20,8,64,.22),0 20px 30px rgba(13,7,48,.24)}
  #tabs button{transition:background .18s ease,transform .18s ease}
}
</style>
<style id="modern-arcade-redesign">
:root{
  --bg:#070b16;
  --bg2:#0c1222;
  --panel:#101827;
  --panel2:#141e31;
  --line:rgba(148,163,184,.16);
  --text:#f8fafc;
  --muted:#8fa0bb;
  --blue:#4f7cff;
  --cyan:#18c8ff;
  --violet:#9b5cff;
  --green:#24e08a;
  --orange:#ff704d;
  --gold:#ffd34f;
}
html{background:var(--bg)}
body{
  width:100%;
  max-width:none;
  min-height:100svh;
  margin:0;
  padding:0 20px calc(96px + env(safe-area-inset-bottom));
  display:block;
  color:var(--text);
  background:
    radial-gradient(900px 420px at 50% -180px,rgba(79,124,255,.20),transparent 65%),
    radial-gradient(650px 420px at 100% 25%,rgba(155,92,255,.10),transparent 70%),
    linear-gradient(180deg,#080d18 0%,#070b15 100%) !important;

  overflow-x:hidden;
}
body:before{

  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:42px 42px;

}
.topbar{

  height:82px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  position:relative;
  z-index:2;
}

.brand-mark{

}

.top-actions{display:flex;align-items:center;gap:9px}
.coin-pill{

  background:rgba(15,24,40,.82);

}
.coin-pill b{font-size:14px}
.icon{
  width:42px;height:42px;padding:0;border-radius:13px;
  display:grid;place-items:center;
  background:#101a2a;border:1px solid var(--line);

}
.icon:hover{background:#172238;border-color:rgba(100,140,255,.45)}
#daily,#bar,#lvl,#info,#tip{width:min(100%,1180px);max-width:1180px}
#daily{margin:18px auto 0}
#bar{
  margin:18px auto 0;
  display:flex;align-items:center;gap:12px;
}
#bar button{
  background:#111b2c;border:1px solid var(--line);color:#cbd7e8;border-radius:12px;
}

}

  font-size:13px;
}

  max-width:1180px;

  padding-top:24px;

  z-index:1;
}
#home{
  display:block;
}

.section-head h3{margin:0;font-size:25px;letter-spacing:-.7px}
.section-head span{font-size:12px;color:#687b97}
.filters{display:flex;gap:8px;margin-bottom:18px;overflow:auto;padding-bottom:2px}

.card-score{color:#a9b7ca;font-size:12px}
.card-score b{color:#ffd65a}

  if (n <= 0) return 0;
  qReset(); D.coins += n; D.st.earned += n; store(); checkAch(); coinUI(); toast('+' + n + ' 🪙 ' + why);
  return n;
}
function beep(f, d = .08) {
  if (!snd) return;
  try {
    getAC();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = f; g.gain.value = .04;
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
const info = t => $('#info').textContent = t;
function banner(a, b, d) {
  c.fillStyle = 'rgba(15,14,26,.78)'; c.fillRect(0, 160, 360, 140);
  c.textAlign = 'center'; c.fillStyle = '#ffc857'; c.font = "16px 'Press Start 2P',monospace";

  c.fillStyle = '#f4efe6'; c.font = "9px 'Press Start 2P',monospace";

}
const stars = Array.from({ length: 30 }, () => ({ x: Math.random() * 360, y: Math.random() * 480, s: Math.random() * 2 + 1 }));
function backdrop() {

}

/* ---------- Effects ---------- */
const parts = []; let shake = 0;
function burst(x, y, v, n = 12) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.3, sp = Math.random() * 3 + 1; parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, l: 30 + Math.random() * 20, c: v, i }); }
}
function fx() {
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.l--; c.globalAlpha = clamp(p.l / 30, 0, 1); c.fillStyle = col(p.c, p.i); c.fillRect(p.x, p.y, 4, 4); });
  c.globalAlpha = 1;
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].l <= 0) parts.splice(i, 1);
}

/* ---------- Flappy ---------- */
const F = {
  init() { this.y = 240; this.v = 0; this.p = []; this.s = 0; this.dead = false; this.t = 0; this.go = false; this.got = 0; this.lg = 240; this.inv = 0; this.sh = D.owned.includes('x3') ? 1 : 0; },
  act() {
    if (this.dead) { if (performance.now() - this.dt < 400) return; this.init(); }
    this.go = true; this.v = -5.6; beep(520, .05); burst(78, this.y + 10, item(D.eq.b).c, 4);
  },
  hit() {
    if (this.sh) { this.sh = 0; this.inv = 60; shake = 8; burst(80, this.y, '#7cc6ff', 20); beep(200, .15); return; }
    this.dead = true; this.dt = performance.now(); shake = 12; burst(80, this.y, item(D.eq.b).c, 30);
    stat('plays'); rec('flappy', this.s); this.got = earn(this.s, 'flappy'); beep(120, .3);
  },
  step() {
    if (!this.go) { this.y = 240 + Math.sin(fr / 10) * 8; return; }
    if (this.dead) return;
    const gh = LV[D.lvl].gap;
    this.v = Math.min(this.v + .32, 8); this.y += this.v; this.t++;
    if (this.inv) this.inv--;
    if (D.eq.r !== 'r0' && fr % 2 === 0) parts.push({ x: 70, y: this.y, vx: -2, vy: Math.random() - .5, l: 22, c: item(D.eq.r).c, i: fr });
    if (this.t % 100 === 1) { this.lg = clamp(this.lg + (Math.random() * 2 - 1) * 110, 130, 350); this.p.push({ x: 360, g: this.lg }); }
    this.p.forEach(o => o.x -= LV[D.lvl].spd);
    if (this.p.length && this.p[0].x < -60) this.p.shift();
    for (const o of this.p) {
      if (!o.d && o.x + 46 < 80) { o.d = 1; this.s++; beep(880, .05); burst(80, this.y, '#ffc857', 6); }
      if (!this.inv && 92 > o.x && 68 < o.x + 46 && (this.y - 12 < o.g - gh || this.y + 12 > o.g + gh)) { this.hit(); break; }
    }
    if (this.y < 12) { this.y = 12; this.v = 0; }
    if (!this.dead && this.y > 468) { this.hit(); if (!this.dead) { this.y = 430; this.v = -7; } }
  },
  draw() {
    backdrop();
    const gh = LV[D.lvl].gap;
    this.p.forEach(o => {
      const x=o.x,w=46,cap=16;
      const pipe=(y,h,capY)=>{
        if(h<=0)return;
        c.fillStyle='#35ad35';c.fillRect(x,y,w,h);
        c.fillStyle='#55d83f';c.fillRect(x+4,y,10,h);
        c.fillStyle='#21872b';c.fillRect(x+w-8,y,8,h);
        c.fillStyle='#42c83a';c.fillRect(x-5,capY,56,cap);
        c.fillStyle='#67ea4b';c.fillRect(x,capY+3,12,cap-6);
        c.fillStyle='#1d8127';c.fillRect(x+48,capY,3,cap);
      };
      pipe(0,o.g-gh,o.g-gh-cap);pipe(o.g+gh,480-(o.g+gh),o.g+gh);
    });
    if (!(this.inv && this.inv % 6 < 3)) {
      const bc = col(item(D.eq.b).c);
      c.save(); c.translate(80, this.y); c.rotate(clamp(this.v / 10, -.5, 1));
      c.shadowBlur=8;c.shadowColor='rgba(0,0,0,.12)';c.fillStyle=bc;c.beginPath();c.arc(0,0,13,0,Math.PI*2);c.fill();c.shadowBlur=0;
      c.fillStyle='rgba(75,115,115,.7)';c.beginPath();c.ellipse(-2,4,8,5,-.2,0,Math.PI*2);c.fill();
      c.fillStyle='#fff';c.beginPath();c.arc(6,-6,6,0,Math.PI*2);c.fill();c.fillStyle='#111';c.beginPath();c.arc(8,-6,3,0,Math.PI*2);c.fill();
      c.fillStyle='#f47b24';c.beginPath();c.moveTo(10,0);c.lineTo(23,4);c.lineTo(10,8);c.closePath();c.fill();c.restore();
    }
    c.textAlign = 'center'; c.fillStyle = '#f4efe6'; c.font = "22px 'Press Start 2P',monospace"; c.fillText(this.s, 180, 60);
    if (this.sh) { c.textAlign = 'right'; c.font = '16px serif'; c.fillText('🛡️', 346, 30); }
    info('Score ' + this.s + '   Best ' + (D.best.flappy || 0));
    if (!this.go) banner('FLAPPY', 'Tap to start');
    else if (this.dead) banner('GAME OVER', 'Tap to retry', '+' + this.got + ' coins');
  }
};

/* ---------- Snake ---------- */
const S = {
  init() {
    this.b = [{ x: 9, y: 12 }, { x: 8, y: 12 }, { x: 7, y: 12 }];
    this.d = { x: 1, y: 0 }; this.n = this.d; this.s = 0; this.dead = false; this.t = 0; this.go = false; this.got = 0;
    this.f = this.food();
  },
  food() {
    let f;
    do f = { x: Math.random() * 18 | 0, y: Math.random() * 24 | 0 };
    while (this.b.some(q => q.x === f.x && q.y === f.y));
    return f;
  },
  dir(x, y) { this.go = true; if (x !== -this.d.x || y !== -this.d.y) this.n = { x, y }; },
  act() { if (this.dead) { if (performance.now() - this.dt < 400) return; this.init(); } else this.go = true; },
  step() {
    if (!this.go || this.dead) return;
    if (++this.t < Math.max(LV[D.lvl].smin, LV[D.lvl].sb - (this.s >> 2))) return;
    this.t = 0; this.d = this.n;
    const h = { x: this.b[0].x + this.d.x, y: this.b[0].y + this.d.y };
    if (h.x < 0 || h.y < 0 || h.x >= 18 || h.y >= 24 || this.b.some(q => q.x === h.x && q.y === h.y)) {
      shake = 10; burst(this.b[0].x * 20 + 10, this.b[0].y * 20 + 10, '#ff5d73', 30); this.dead = true; this.dt = performance.now(); stat('plays'); rec('snake', this.s); this.got = earn(this.s, 'snake'); beep(120, .3); return;
    }
    this.b.unshift(h);
    if (h.x === this.f.x && h.y === this.f.y) { burst(h.x * 20 + 10, h.y * 20 + 10, '#ffc857', 10); this.s++; this.f = this.food(); beep(660, .05); } else this.b.pop();
  },
  draw() {
    backdrop();
    c.textAlign = 'center'; c.font = '18px serif'; c.fillText(item(D.eq.f).c, this.f.x * 20 + 10, this.f.y * 20 + 16 + Math.sin(fr / 8) * 2);
    const cs = item(D.eq.s).c;
    this.b.forEach((q, i) => { c.fillStyle = cs === 'rb' ? col('rb', i) : cs[i ? 1 : 0]; c.fillRect(q.x * 20 + 1, q.y * 20 + 1, 18, 18); });
    info('Score ' + this.s + '   Best ' + (D.best.snake || 0));
    if (!this.go) banner('SNAKE', 'Press a key or swipe');
    else if (this.dead) banner('GAME OVER', 'Tap to retry', '+' + this.got + ' coins');
  }
};

/* ---------- Pong (you = bottom paddle) ---------- */
const K = {};
const P = {
  init() { this.px = 150; this.ax = 150; this.ps = 0; this.as = 0; this.over = false; this.go = false; this.got = 0; this.rs(); },
  rs() { this.bx = 180; this.by = 240; this.vx = Math.random() * 3 - 1.5; this.vy = Math.random() < .5 ? -3.6 : 3.6; this.w = 50; this.tr = []; },
  act() { if (this.over) { if (performance.now() - this.dt < 400) return; this.init(); } this.go = true; },
  chk(pl) {
    shake = 6; burst(this.bx, pl ? 10 : 470, pl ? '#ffc857' : '#ff5d73', 18);
    if (this.ps >= 5 || this.as >= 5) { this.over = true; this.dt = performance.now(); stat('plays'); if (this.ps >= 5) stat('pongWins'); this.got = this.ps >= 5 ? earn(15, 'pong win') : 0; }
    else this.rs();
  },
  step() {
    if (!this.go || this.over) return;
    if (this.w > 0) { this.w--; return; }
    if (K.arrowleft || K.a) this.px -= 7;
    if (K.arrowright || K.d) this.px += 7;
    this.px = clamp(this.px, 0, 290);
    const sp = LV[D.lvl].bot * (D.owned.includes('x4') ? .7 : 1);
    const tgt = this.vy < 0 ? this.bx - 35 + Math.sin(fr / 20) * 18 : 145;
    this.ax = clamp(this.ax + clamp(tgt - this.ax, -sp, sp), 0, 290);
    this.tr.push({ x: this.bx, y: this.by }); if (this.tr.length > 8) this.tr.shift();
    this.bx += this.vx; this.by += this.vy;
    if (this.bx < 6 || this.bx > 354) { this.vx *= -1; this.bx = clamp(this.bx, 6, 354); beep(250, .03); }
    if (this.vy > 0 && this.by + 6 >= 450 && this.by - 6 <= 464 && this.bx >= this.px - 4 && this.bx <= this.px + 74) {
      this.by = 444; this.vy = -Math.min(7, this.vy * 1.05); this.vx = clamp(this.vx + (this.bx - this.px - 35) * .12, -6, 6);
      beep(440, .05); burst(this.bx, 450, col(item(D.eq.p).c), 6);
    }
    if (this.vy < 0 && this.by - 6 <= 36 && this.by + 6 >= 22 && this.bx >= this.ax - 4 && this.bx <= this.ax + 74) {
      this.by = 42; this.vy = Math.min(7, -this.vy * 1.05); beep(330, .05);
    }
    if (this.by < -10) { this.ps++; beep(700); this.chk(true); }
    else if (this.by > 490) { this.as++; beep(150); this.chk(false); }
  },
  draw() {
    backdrop();
    c.fillStyle = 'rgba(255,255,255,.2)'; for (let x = 0; x < 360; x += 24) c.fillRect(x, 238, 12, 4);
    const pc = col(item(D.eq.p).c);
    c.shadowBlur = 14;
    c.shadowColor = pc; c.fillStyle = pc; c.fillRect(this.px, 450, 70, 12);

const WORDS = 'apple bread crane drive eagle flame grape house input joker knife lemon mouse night ocean piano queen river snake tiger uncle vivid water zebra brick cloud dance earth field giant heart ivory juice light money nurse olive pearl quiet robot stone table voice wheel young beach candy dream frost glass happy jelly laser magic novel'.split(' ');

  h += ['qwertyuiop', 'asdfghjkl', '⏎zxcvbnm⌫'].map(r => '<div class="kr">' + [...r].map(ch => `<button data-k="${ch}" class="${ks[ch] || ''}">${ch}</button>`).join('') + '</div>').join('');

/* ---------- Tic-Tac-Toe (you = X) ---------- */
const L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let T = { b: [] };
const winner = b => { for (const [x, y, z] of L) if (b[x] && b[x] === b[y] && b[x] === b[z]) return b[x]; return b.every(Boolean) ? 'draw' : null; };
function mm(b, p) {
  const w = winner(b); if (w) return w === 'O' ? 1 : w === 'X' ? -1 : 0;
  let r = p === 'O' ? -2 : 2;
  for (let i = 0; i < 9; i++) if (!b[i]) { b[i] = p; const v = mm(b, p === 'O' ? 'X' : 'O'); b[i] = ''; r = p === 'O' ? Math.max(r, v) : Math.min(r, v); }
  return r;
}
function hardMove() {
  let bi = -1, bv = -2;
  T.b.forEach((v, i) => { if (!v) { T.b[i] = 'O'; const sc = mm(T.b, 'X'); T.b[i] = ''; if (sc > bv) { bv = sc; bi = i; } } });
  return bi;
}
function botMove() {
  const b = T.b, empty = b.map((v, i) => v ? -1 : i).filter(i => i >= 0);
  if (D.lvl === 'hard') return hardMove();
  if (D.lvl === 'easy' && Math.random() < .6) return empty[Math.random() * empty.length | 0];
  for (const who of ['O', 'X'])
    for (const i of empty) { b[i] = who; const w = winner(b) === who; b[i] = ''; if (w) return i; }
  return b[4] ? empty[Math.random() * empty.length | 0] : 4;
}
function tttRender() {
  const w = winner(T.b);
  $('#ttt').innerHTML = T.b.map((v, i) => `<button data-i="${i}" ${v || w ? 'disabled' : ''}>${v}</button>`).join('');
  info(w === 'X' ? 'You win!' : w === 'O' ? 'Bot wins' : w === 'draw' ? 'Draw' : 'Your turn (X)');
  $('#again').hidden = !w;
}
$('#ttt').onclick = e => {
  const i = e.target.dataset.i;
  if (i === undefined || T.b[i] || winner(T.b)) return;
  T.b[i] = 'X'; beep(500, .05);

};

    `<div class="row"><span>${D.ach.includes(a.id) ? '🏆' : '🔒'} ${a.n}<br><small>${a.d}</small></span><span>+${a.r} 🪙</span></div>`).join('');

}
$('#goals').onclick = e => {

  D.q.done.push(q.id); D.coins += q.r; store(); coinUI(); beep(880, .15); toast('+' + Math.max(1, Math.floor(q.r / 4)) + ' 🪙 quest done'); goalsRender();

function profRender() {

function homeRender(){ /* Final renderer is installed below in final-arcade-shop-and-home-fix. */ }

  // Route cards and Quick Play into the existing show system.
  document.addEventListener('click',e=>{
    const card=e.target.closest('.game-card[data-g], [data-g]');
    if(card && card.dataset.g && !e.target.closest('.feature-play')){e.preventDefault();show(card.dataset.g);}
  },true);

  const oldShow2=show;
  show=function(g){
    if(g==='chess'){
      cur='chess';playSong('chill');whStop();clearInterval(ckT);parts.length=0;
      $('#lvl').hidden=true;$('#bar').hidden=false;$('#gt').textContent='♟ Chess';
      document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==='home'));
      ['home','ttt','mem','wh','cookie','word','shop','goals','prof'].forEach(id=>$('#'+id).hidden=true);
      $('#cv').hidden=false;$('#again').hidden=true;$('#tip').textContent=TIPS.chess;
      CH.init();CH.draw();return;
    }
    return oldShow2(g);
  };
  // Existing canvas coordinate helper
  cv.addEventListener('pointerdown',e=>{if(cur==='chess')CH.tap(...cp(e));});

  // Styling upgrade: premium badges, richer game cards, status bar.
  const style=document.createElement('style');

            for(let bb=0;bb<b.length;bb++){
              if(a===bb||b[bb].length>=4) continue;
              const empty=b[bb].length===0;
              const same=!empty&&b[bb][b[bb].length-1]===top;
              if(!empty&&!same) continue;
              if(a===lastB&&bb===lastA) continue;

<script id="premium-shop-navigation-fix-v2">
(function(){
  function fixShopNavigation(){
    const p=document.getElementById('shopPanel');
    if(!p)return;
    const premium=document.getElementById('premiumShopView');
    const normal=p.querySelector('#normalShopGrid');
    const normalSection=normal ? normal.closest('.shop-section') : null;
    if(!premium || !normalSection)return;

    // Switching to any normal category must bring the normal shop back.
    p.addEventListener('click',function(e){
      const cat=e.target.closest('[data-shop-cat]');
      if(!cat || cat.dataset.shopCat==='premium')return;
      premium.hidden=true;
      normalSection.hidden=false;
    },true);

    // The premium tab must explicitly hide the normal grid.
    p.addEventListener('click',function(e){
      const cat=e.target.closest('[data-shop-cat="premium"]');
      if(!cat)return;
      premium.hidden=false;
      normalSection.hidden=true;
    },true);
  }
  fixShopNavigation();
  // Re-run after shopPanel is rebuilt/opened.
  const oldOpen=window.openShop;
  if(typeof oldOpen==='function'){
    window.openShop=function(){
      oldOpen.apply(this,arguments);
      setTimeout(fixShopNavigation,0);
    };
  }
})();
</script>

<script id="new-games-input-fix-v7">
(()=>{
'use strict';
const RESTORE=['brick','asteroid'];
for(const g of RESTORE)if(!GAMES.includes(g))GAMES.splice(Math.max(0,GAMES.length-4),0,g);
Object.assign(GI,{brick:['🧱','Brick Breaker'],asteroid:['☄️','Asteroid Strike']});
Object.assign(VIEW,{brick:'cv',asteroid:'cv'});
Object.assign(TIPS,{brick:'Move the paddle with touch or arrows. Break every brick and clear the stage.',asteroid:'Move the ship and survive the asteroid waves. Auto-fire is enabled.'});
Object.assign(RATE,{brick:.45,asteroid:.45});
Object.assign(CG,{brick:BB,asteroid:AS});

// The new games use the same canvas as the original arcade games.
// Route taps/keys directly to their game controllers.
document.addEventListener('keydown',e=>{
  if(!['rocket','stack','bomb','blade','brick','asteroid'].includes(cur))return;
  const k=e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown','a','d','w','s',' '].includes(k))e.preventDefault();
  if(cur==='rocket')R.key(k);
  else if(cur==='stack')R.S.key(k);
  else if(cur==='bomb')R.B.key(k);
  else if(cur==='blade')R.D.key(k);
  else if(cur==='brick'){if(k==='arrowleft'||k==='a')BB.left();else if(k==='arrowright'||k==='d')BB.right();else if(k===' ')BB.act();}
  else if(cur==='asteroid')AS.key(k);
},true);
cv.addEventListener('pointerdown',e=>{
  if(!['rocket','stack','bomb','blade','brick','asteroid'].includes(cur))return;
  const r=cv.getBoundingClientRect();
  const x=clamp((e.clientX-r.left)/r.width*360,0,360);
  if(cur==='rocket'){R.move(x);R.act();}
  else if(cur==='stack'){R.S.move(x);R.S.act();}
  else if(cur==='bomb'){R.B.move(x);R.B.act();}
  else if(cur==='blade'){R.D.move(x);R.D.act();}
  else if(cur==='brick'){BB.move(x);BB.act();}
  else if(cur==='asteroid'){AS.move(x);AS.act();}
  e.preventDefault();
},true);
cv.addEventListener('pointermove',e=>{
  if(!['rocket','stack','bomb','blade','brick','asteroid'].includes(cur))return;
  const r=cv.getBoundingClientRect();
  const x=clamp((e.clientX-r.left)/r.width*360,0,360);
  if(cur==='rocket')R.move(x);
  else if(cur==='stack')R.S.move(x);
  else if(cur==='bomb')R.B.move(x);
  else if(cur==='blade')R.D.move(x);
  else if(cur==='brick')BB.move(x);
  else if(cur==='asteroid')AS.move(x);
},true);

const oldHomeFix=homeRender;
homeRender=function(){
  oldHomeFix();
  const grid=document.querySelector('#home .game-grid');
  if(!grid)return;
  const wanted=[...grid.querySelectorAll('.game-card[data-g]')];
  const has=new Set(wanted.map(x=>x.dataset.g));
  for(const g of RESTORE){
    if(has.has(g))continue;
    const m={brick:['🧱','Brick Breaker','Classic brick-breaking arcade'],asteroid:['☄️','Asteroid Strike','Auto-fire space survival']}[g];
    const card=document.createElement('button');card.className='game-card premium-card restored-game-card';card.dataset.g=g;card.dataset.cat='Arcade';
    card.innerHTML=`<span class="game-art"><span class="new-icon">${m[0]}</span><span class="new-mini-label">ARCADE</span></span><span class="game-meta"><span class="game-badge">RESTORED</span><h4>${m[1]}</h4><p>${m[2]}</p><span class="card-score"><span class="trophy">♛</span> <b>Play now</b></span></span><span class="play-mini"><span>▶</span></span>`;
    grid.appendChild(card);
  }
};
setTimeout(()=>{try{homeRender();}catch(e){console.error(e)}},30);
})();
</script>
